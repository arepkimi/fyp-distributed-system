# -----------------------------------------------------------------------
# 0. STORAGE LAYER: SHARED CLUSTER CLOUD FILE PIPELINE
# -----------------------------------------------------------------------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: assembly-shared-pvc
spec:
  accessModes:
    - ReadWriteOnce  # GKE Autopilot native storage handles this instantly
  resources:
    requests:
      storage: 2Gi   # Provides plenty of space for image processing batches
---
# -----------------------------------------------------------------------
# 1. GATEWAY LAYER: FLASK COMPONENT + INTERNAL PARALLEL ENGINE
# -----------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fyp-dashboard-deployment
spec:
  replicas: 1  # DASHBOARD CONFIGURED TO 1 REPLICA AS REQUESTED
  selector:
    matchLabels:
      app: fyp-dashboard
  template:
    metadata:
      labels:
        app: fyp-dashboard
    spec:
      containers:
      - name: gateway-container
        image: asia-southeast1-docker.pkg.dev/fyp-distributed-system-155462/fyp-images/dashboard-gateway:latest
        ports:
        - containerPort: 5000
        resources:
          requests:
            cpu: "500m"         # Scaled down from 3 to bypass Insufficient CPU blocks
            memory: "1Gi"       # Scaled down from 3Gi to bypass Insufficient Memory blocks
          limits:
            cpu: "1"
            memory: "2Gi"
        livenessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 10
        env:
        - name: BW_ADDR
          value: "bw-dns-service:50051"
        - name: BRIGHT_ADDR
          value: "bright-dns-service:50052"
        - name: BLUR_ADDR
          value: "blur-dns-service:50053"
        volumeMounts:
        - name: shared-pipeline-space
          mountPath: /app/shared_output  # Matches app.py SHARED_OUTPUT_DIR
      volumes:
      - name: shared-pipeline-space
        persistentVolumeClaim:
          claimName: assembly-shared-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: fyp-dashboard-service
spec:
  type: LoadBalancer       
  selector:
    app: fyp-dashboard
  ports:
  - port: 80
    targetPort: 5000

---
# -----------------------------------------------------------------------
# 2. MICROSERVICE TIER: STAGE 1 - BLACK & WHITE WORKER PODS
# -----------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bw-worker-deployment
spec:
  replicas: 2  # WORKER TIER 1 CONFIGURED TO 2 REPLICAS
  selector:
    matchLabels:
      app: bw-worker
  template:
    metadata:
      labels:
        app: bw-worker
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - bw-worker
              topologyKey: "kubernetes.io/hostname"
      containers:
      - name: bw-container
        image: asia-southeast1-docker.pkg.dev/fyp-distributed-system-155462/fyp-images/bw-worker:latest
        ports:
        - containerPort: 50051
        resources:
          requests:
            cpu: "500m"      
            memory: "512Mi"
          limits:
            cpu: "1"
            memory: "1Gi"
        livenessProbe:
          tcpSocket:
            port: 50051
          initialDelaySeconds: 10
          periodSeconds: 5
        env:
        - name: BRIGHT_ADDR
          value: "bright-dns-service:50052"  # Points down the assembly line
---
apiVersion: v1
kind: Service
metadata:
  name: bw-dns-service
spec:
  type: ClusterIP  
  selector:
    app: bw-worker
  ports:
  - port: 50051
    targetPort: 50051

---
