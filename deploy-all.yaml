# -----------------------------------------------------------------------
# 5. TELEMETRY VISUALIZATION TIER: GRAFANA INFRASTRUCTURE
# -----------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fyp-grafana-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fyp-grafana
  template:
    metadata:
      labels:
        app: fyp-grafana
    spec:
      containers:
      - name: grafana-container
        image: grafana/grafana:latest
        ports:
        - containerPort: 3000
        env:
        - name: GF_SECURITY_ALLOW_EMBEDDING
          value: "true"
        - name: GF_SECURITY_COOKIE_SECURE
          value: "true"
        - name: GF_SECURITY_COOKIE_SAME_SITE
          value: "none"
        - name: GF_AUTH_ANONYMOUS_ENABLED
          value: "true"
        - name: GF_AUTH_ANONYMOUS_ORG_ROLE
          value: "Admin"
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-dns-service
spec:
  type: LoadBalancer
  selector:
    app: fyp-grafana
  ports:
  - name: http           
    port: 80
    targetPort: 3000
