# -----------------------------------------------------------------------
# 4. MICROSERVICE TIER: STAGE 3 - GAUSSIAN BLUR WORKER PODS
# -----------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blur-worker-deployment
spec:
  replicas: 2  # WORKER TIER 3 CONFIGURED TO 2 REPLICAS
  selector:
    matchLabels:
      app: blur-worker
  template:
    metadata:
      labels:
        app: blur-worker
    spec:
      # --- FIXED: FORCE CO-LOCATION WITH DASHBOARD TO SHARE DISK SECURELY ---
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - fyp-dashboard
            topologyKey: "kubernetes.io/hostname"
      containers:
      - name: blur-container
        image: asia-southeast1-docker.pkg.dev/fyp-distributed-system-155462/fyp-images/blur-worker:latest
        ports:
        - containerPort: 50053
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "1"
            memory: "1Gi"
        livenessProbe:
          tcpSocket:
            port: 50053
          initialDelaySeconds: 10
          periodSeconds: 5
        volumeMounts:
        - name: shared-pipeline-space
          mountPath: /app/shared_output  # Writes completed pipeline images here
      volumes:
      - name: shared-pipeline-space
        persistentVolumeClaim:
          claimName: assembly-shared-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: blur-dns-service
spec:
  type: ClusterIP
  selector:
    app: blur-worker
  ports:
  - port: 50053
    targetPort: 50053

---
# -----------------------------------------------------------------------
# 5. TELEMETRY VISUALIZATION TIER: GRAFANA INFRASTRUCTURE
# -----------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fyp-grafana-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fyp-grafana
  template:
    metadata:
      labels:
        app: fyp-grafana
    spec:
      containers:
      - name: grafana-container
        image: grafana/grafana:latest
        ports:
        - containerPort: 3000
        env:
        - name: GF_SECURITY_ALLOW_EMBEDDING
          value: "true"
        - name: GF_SECURITY_COOKIE_SECURE
          value: "true"
        - name: GF_SECURITY_COOKIE_SAME_SITE
          value: "none"
        - name: GF_AUTH_ANONYMOUS_ENABLED
          value: "true"
        - name: GF_AUTH_ANONYMOUS_ORG_ROLE
          value: "Admin"
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-dns-service
spec:
  type: LoadBalancer
  selector:
    app: fyp-grafana
  ports:
  - name: http           
    port: 80
    targetPort: 3000
