# -----------------------------------------------------------------------
# 1. GATEWAY LAYER: FLASK COMPONENT + INTERNAL PARALLEL ENGINE (1 REPLICA)
# -----------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fyp-dashboard-deployment
spec:
  replicas: 1  # 1 Replica ensures an unadulterated, clean architectural benchmark environment
  selector:
    matchLabels:
      app: fyp-dashboard
  template:
    metadata:
      labels:
        app: fyp-dashboard
    spec:
      containers:
      - name: gateway-container
        image: asia-southeast1-docker.pkg.dev/YOUR_GCP_PROJECT_ID/fyp-images/dashboard-gateway:latest
        ports:
        - containerPort: 5000
        resources:
          requests:
            cpu: "3"         # GUARANTEES GKE maps 3 physical CPU cores to this pod for 3-worker Parallel execution
            memory: "3Gi"    # Prevents Out-Of-Memory crashing during heavy multi-process image mapping
          limits:
            cpu: "4"
            memory: "4Gi"
        # FAULT TOLERANCE: Check if the Flask web server interface is completely locked up
        livenessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 10
        env:
        - name: BW_ADDR
          value: "bw-dns-service:50051"
        - name: BRIGHT_ADDR
          value: "bright-dns-service:50052"
        - name: BLUR_ADDR
          value: "blur-dns-service:50053"
---
apiVersion: v1
kind: Service
metadata:
  name: fyp-dashboard-service
spec:
  type: LoadBalancer       # Creates your public external Cloud IP routing to your dashboard browser interface
  selector:
    app: fyp-dashboard
  ports:
  - port: 80
    targetPort: 5000

---
# -----------------------------------------------------------------------
# 2. MICROSERVICE TIER: BLACK & WHITE WORKER POD (1 REPLICA)
# -----------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bw-worker-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: bw-worker
  template:
    metadata:
      labels:
        app: bw-worker
    spec:
      containers:
      - name: bw-container
        image: asia-southeast1-docker.pkg.dev/YOUR_GCP_PROJECT_ID/fyp-images/bw-worker:latest
        ports:
        - containerPort: 50051
        # FAULT TOLERANCE: TCP stream checking ensures the gRPC service port is actively listening
        livenessProbe:
          tcpSocket:
            port: 50051
          initialDelaySeconds: 10
          periodSeconds: 5
        readinessProbe:
          tcpSocket:
            port: 50051
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: bw-dns-service
spec:
  type: ClusterIP  # Locks communication strictly within the secure internal virtual cloud network
  selector:
    app: bw-worker
  ports:
  - port: 50051
    targetPort: 50051

---
