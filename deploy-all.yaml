# -----------------------------------------------------------------------
# 1. GATEWAY LAYER: FLASK COMPONENT + INTERNAL PARALLEL ENGINE (Node 1)
# -----------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fyp-dashboard-deployment
spec:
  replicas: 1  # Kept at 1 so your web session endpoint remains singular
  selector:
    matchLabels:
      app: fyp-dashboard
  template:
    metadata:
      labels:
        app: fyp-dashboard
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - bw-worker
                - bright-worker
                - blur-worker
            topologyKey: "kubernetes.io/hostname"
      containers:
      - name: gateway-container
        image: asia-southeast1-docker.pkg.dev/YOUR_GCP_PROJECT_ID/fyp-images/dashboard-gateway:latest
        ports:
        - containerPort: 5000
        resources:
          requests:
            cpu: "3"         
            memory: "3Gi"    
          limits:
            cpu: "4"
            memory: "4Gi"
        livenessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 10
        env:
        - name: BW_ADDR
          value: "bw-dns-service:50051"
        - name: BRIGHT_ADDR
          value: "bright-dns-service:50052"
        - name: BLUR_ADDR
          value: "blur-dns-service:50053"
---
apiVersion: v1
kind: Service
metadata:
  name: fyp-dashboard-service
spec:
  type: LoadBalancer       
  selector:
    app: fyp-dashboard
  ports:
  - port: 80
    targetPort: 5000

---
# -----------------------------------------------------------------------
# 2. MICROSERVICE TIER: BLACK & WHITE WORKER PODS (Node 2 - 2 Pods)
# -----------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bw-worker-deployment
spec:
  replicas: 2  # Bumped to 2 for Active Redundancy
  selector:
    matchLabels:
      app: bw-worker
  template:
    metadata:
      labels:
        app: bw-worker
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - fyp-dashboard
                - bright-worker
                - blur-worker
            topologyKey: "kubernetes.io/hostname" # Ensures no co-location with other worker types
      containers:
      - name: bw-container
        image: asia-southeast1-docker.pkg.dev/YOUR_GCP_PROJECT_ID/fyp-images/bw-worker:latest
        ports:
        - containerPort: 50051
        resources:
          requests:
            cpu: "500m"      # Split allocation so 2 pods fit comfortably onto 1 host node
            memory: "512Mi"
          limits:
            cpu: "1"
            memory: "1Gi"
        livenessProbe:
          tcpSocket:
            port: 50051
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: bw-dns-service
spec:
  type: ClusterIP  
  selector:
    app: bw-worker
  ports:
  - port: 50051
    targetPort: 50051

---
