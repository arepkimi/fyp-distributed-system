# -----------------------------------------------------------------------
# 1. GATEWAY LAYER: FLASK GATEWAY + ACCELERATED PARALLEL ENGINE
# -----------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fyp-dashboard-deployment
spec:
  replicas: 1  
  selector:
    matchLabels:
      app: fyp-dashboard
  template:
    metadata:
      labels:
        app: fyp-dashboard
    spec:
      containers:
      - name: gateway-container
        image: asia-southeast1-docker.pkg.dev/fyp-distributed-system-155462/fyp-images/dashboard-gateway:latest
        ports:
        - containerPort: 5000
        resources:
          requests:
            cpu: "500m"         # Low entry request allows immediate node scheduling
            memory: "1Gi"       
          limits:
            cpu: "3"            # Burst ceiling intact for local parallel benchmarks!
            memory: "3Gi"       
        env:
        - name: BW_ADDR
          value: "dns:///bw-dns-service:50051"
---
apiVersion: v1
kind: Service
metadata:
  name: fyp-dashboard-service
spec:
  type: LoadBalancer       
  selector:
    app: fyp-dashboard
  ports:
  - port: 80
    targetPort: 5000

---
# -----------------------------------------------------------------------
# 2. MICROSERVICE TIER: STAGE 1 - BLACK & WHITE WORKER REPLICAS
# -----------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bw-worker-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: bw-worker
  template:
    metadata:
      labels:
        app: bw-worker
    spec:
      affinity:
        # --- ANTI-AFFINITY: FORBIDDEN FROM SHARING A NODE WITH THE DASHBOARD ---
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - fyp-dashboard
            topologyKey: "kubernetes.io/hostname"
      containers:
      - name: bw-container
        image: asia-southeast1-docker.pkg.dev/fyp-distributed-system-155462/fyp-images/bw-worker:latest
        ports:
        - containerPort: 50051
        resources:
          requests:
            cpu: "500m"      
            memory: "512Mi"
          limits:
            cpu: "1"
            memory: "1Gi"
        env:
        - name: BRIGHT_ADDR
          value: "dns:///bright-dns-service:50052"  
---
apiVersion: v1
kind: Service
metadata:
  name: bw-dns-service
spec:
  type: ClusterIP  
  selector:
    app: bw-worker
  ports:
  - port: 50051
    targetPort: 50051

---
