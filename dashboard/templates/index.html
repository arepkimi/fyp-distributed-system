<!DOCTYPE html>
<html>
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>FYPsystem | Start</title>
    <style>
        /* Brighter, professional tech interface colors */
        body { 
            background: #1e293b; /* Bright Slate Blue/Gray background instead of deep pitch black */
            color: #f8fafc; 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-family: system-ui, -apple-system, sans-serif;
        }
        
        .card { 
            background: #ffffff; /* Bright crisp card for maximum contrast against background */
            border: none;
            padding: 35px; 
            border-radius: 16px; 
            width: 520px; 
        }

        h3 {
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        /* Enforce matching borders across all architecture choice buttons */
        .btn-group .btn {
            border: 2px solid #0d6efd !important; /* Uniform primary blue borders */
            color: #0d6efd;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        /* Active/Checked buttons get the exact same look when selected */
        .btn-check:checked + .btn {
            background-color: #0d6efd !important;
            border-color: #0d6efd !important;
            color: #ffffff !important;
            box-shadow: 0 4px 12px rgba(13, 110, 253, 0.3);
        }

        /* Hover animations */
        .btn-group .btn:hover {
            background-color: rgba(13, 110, 253, 0.08);
            color: #0d6efd;
        }

        .form-control {
            border: 2px solid #cbd5e1 !important;
            color: #1e293b !important;
            font-weight: 500;
        }

        .form-control:focus {
            box-shadow: 0 0 0 4px rgba(13, 110, 253, 0.15);
            border-color: #0d6efd !important;
        }
        
        #loading { 
            display: none; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(15, 23, 42, 0.98); /* Rich overlay for presentation loading focus */
            z-index: 100; 
        }
    </style>
</head>
<body>
    <div class="card shadow-2xl text-center" id="formContainer">
        <h3 class="text-dark mb-4">Image Standardization System</h3>
        <p class="text-muted small mt-n3 mb-4">Select Architecture for Dataset Processing</p>
        
        <form action="/process" method="post" enctype="multipart/form-data" onsubmit="startLoading()">
            
            <div class="btn-group w-100 mb-4" role="group">
                <input type="radio" class="btn-check" name="mode" id="m1" value="monolithic" checked>
                <label class="btn" for="m1">Monolith</label>
                
                <input type="radio" class="btn-check" name="mode" id="m3" value="parallel">
                <label class="btn" for="m3">Parallel</label>
                
                <input type="radio" class="btn-check" name="mode" id="m2" value="distributed">
                <label class="btn" for="m2">Distributed</label>
            </div>
            
            <input type="file" name="image" class="form-control mb-4 bg-light" required>
            <button type="submit" class="btn btn-success w-100 fw-bold py-2.5 shadow-sm text-uppercase tracking-wider">Execute System Test</button>
        </form>
    </div>

    <div id="loading">
        <div class="spinner-border text-primary" style="width: 3.5rem; height: 3.5rem; border-width: 0.25em;" role="status"></div>
        <h4 class="mt-4 fw-bold" id="statusHeader">Initializing...</h4>
        <p class="text-muted tracking-wide" id="statusSub">Preparing Evaluation Metrics</p>
    </div>

    <script>
        function startLoading() {
            const selectedMode = document.querySelector('input[name="mode"]:checked').value;
            const statusHeader = document.getElementById('statusHeader');
            const statusSub = document.getElementById('statusSub');
            
            // Interactive UI Messages mapping to your backend code functions
            if (selectedMode === 'parallel') {
                statusHeader.innerText = "Processing In Parallel";
                statusHeader.className = "mt-4 text-warning fw-bold";
                statusSub.innerText = "Executing Multi-Core Data Decomposition Pipeline (ProcessPoolExecutor)";
            } else if (selectedMode === 'distributed') {
                statusHeader.innerText = "Routing gRPC Streams...";
                statusHeader.className = "mt-4 text-info fw-bold";
                statusSub.innerText = "Connecting Microservices";
            } else {
                statusHeader.innerText = "Running Monolith Sequence...";
                statusHeader.className = "mt-4 text-primary fw-bold";
                statusSub.innerText = "Executing Single-Threaded Local Task Sequence Loop";
            }

            // Hide configuration portal and render overlay view
            document.getElementById('formContainer').style.display = 'none';
            document.getElementById('loading').style.display = 'flex';
        }
    </script>
</body>
</html>
