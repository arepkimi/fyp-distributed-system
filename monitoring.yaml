apiVersion: apps/v1
kind: Deployment
metadata:
  name: fyp-grafana-deployment
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fyp-grafana
  template:
    metadata:
      labels:
        app: fyp-grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:latest
        ports:
        - containerPort: 3000
        env:
        - name: GF_SECURITY_ALLOW_EMBEDDING
          value: "true"
        - name: GF_AUTH_ANONYMOUS_ENABLED
          value: "true"
        # Admin privileges enabled for smooth iframe presentations with zero log-ins
        - name: GF_AUTH_ANONYMOUS_ORG_ROLE
          value: "Admin"
        - name: GF_PANELS_DISABLE_SANITIZE_HTML
          value: "true"
        securityContext:
          runAsUser: 472
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: fyp-grafana-service
  namespace: default
spec:
  type: LoadBalancer        # Instructs Google Cloud to assign a public IP endpoint
  selector:
    app: fyp-grafana
  ports:
  - port: 80
    targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-frontend
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus-frontend
  template:
    metadata:
      labels:
        app: prometheus-frontend
    spec:
      automountServiceAccountToken: true
      containers:
      - name: frontend
        # FIX: Switched to Google's standardized upstream production location 
        image: gcr.io/gke-release/prometheus-engine/frontend:v0.12.0-gke.1
        args:
        - "--query.project-id=fyp-distributed-system-155462"
        ports:
        - name: web
          containerPort: 9090
        resources:
          limits:
            cpu: "200m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-frontend-service
  namespace: default
spec:
  type: ClusterIP          # Securely kept internal to avoid exposing raw data maps to the internet
  selector:
    app: prometheus-frontend
  ports:
  - port: 9090
    targetPort: 9090
